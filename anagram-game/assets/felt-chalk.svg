    <use href="#cW" transform="translate(196 300) rotate(-8) scale(.8)"/>
    <use href="#cI" transform="translate(582 292) rotate(6) scale(.8)"/>
    <use href="#cA" transform="translate(600 205) rotate(-4) scale(.7)"/>
