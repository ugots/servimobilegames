<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <filter id="felt-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" stitchTiles="stitch" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#1f4a3d"/>
  <rect x="0" y="0" width="256" height="256" fill="#000" filter="url(#felt-noise)" opacity=".65"/>
  <path d="M0 83h256M0 174h256" stroke="#8ab09a" stroke-opacity=".025"/>
</svg>
