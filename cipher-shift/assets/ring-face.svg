<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="none">
  <!-- Ivory ring surface: curvature shading plus faint grain. Hand drawn, own work, CC0. -->
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a272"/>
      <stop offset="0.22" stop-color="#efe3c4"/>
      <stop offset="0.5" stop-color="#f6ecd2"/>
      <stop offset="0.78" stop-color="#efe3c4"/>
      <stop offset="1" stop-color="#b9a272"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2810" stop-opacity="0.3"/>
      <stop offset="0.08" stop-color="#3a2810" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#3a2810" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2810" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d0e" stop-opacity="0.55"/>
      <stop offset="0.14" stop-color="#2a1d0e" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#2a1d0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1d0e" stop-opacity="0.6"/>
