  </defs>
  <rect width="100" height="200" fill="url(#ivory)"/>
  <g stroke="#8a7650" stroke-width="0.4" opacity="0.12">
    <path d="M0 30 H100"/><path d="M0 52 H100"/><path d="M0 77 H100"/><path d="M0 123 H100"/><path d="M0 148 H100"/><path d="M0 170 H100"/>
  </g>
  <rect width="100" height="200" fill="url(#edge)"/>
  <rect width="100" height="200" fill="url(#roll)"/>
</svg>
