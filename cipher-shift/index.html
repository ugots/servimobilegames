<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cipher Shift</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="../_base/menu.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="cs-bg" aria-hidden="true"></div>
<div id="cs-play" class="gk-hidden">
<h1 class="cs-sr">Cipher Shift</h1>
<header id="cs-hud" class="cs-hud">
  <img class="cs-logo" src="favicon.svg" alt="Cipher Shift logo" width="36" height="36">
  <span id="cs-level">Level 1</span>
  <span id="cs-pips" class="cs-pips" role="img" aria-label="0 of 3 words this level"><span class="cs-pip"></span><span class="cs-pip"></span><span class="cs-pip"></span></span>
  <span id="cs-score" aria-live="polite">Score 0</span>
  <span class="cs-spacer"></span>
  <div id="cs-lives" aria-label="Lives">
    <span class="cs-seal"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" class="cs-wax"/><circle cx="20" cy="20" r="13" class="cs-wax-ring"/><text x="20" y="21" class="cs-wax-c">C</text><path class="cs-crack" d="M24 3 L19 14 L25 20 L17 27 L21 38"/></svg></span>
    <span class="cs-seal"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" class="cs-wax"/><circle cx="20" cy="20" r="13" class="cs-wax-ring"/><text x="20" y="21" class="cs-wax-c">C</text><path class="cs-crack" d="M24 3 L19 14 L25 20 L17 27 L21 38"/></svg></span>
    <span class="cs-seal"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" class="cs-wax"/><circle cx="20" cy="20" r="13" class="cs-wax-ring"/><text x="20" y="21" class="cs-wax-c">C</text><path class="cs-crack" d="M24 3 L19 14 L25 20 L17 27 L21 38"/></svg></span>
  </div>
</header>

<nav class="cs-tools">
  <button id="cs-menu" class="cs-small" type="button" title="Menu (Esc)" aria-keyshortcuts="Escape">Menu</button>
  <button id="cs-sound" class="cs-small cs-icon" type="button" aria-label="Sound on" aria-pressed="false" title="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="cs-speaker" d="M3 9h4l5-4v14l-5-4H3z"/><path class="cs-waves" d="M16 8a6 6 0 0 1 0 8m2.5-11a10 10 0 0 1 0 14"/><path class="cs-slash" d="M4 20 20 4"/></svg></button>
</nav>

<main class="cs-stage"><svg id="cs-dial" role="img" aria-label="Cryptex with letter rings"></svg></main>
<div id="cs-banner" class="cs-banner gk-hidden" role="status" aria-live="polite"><h2 id="cs-banner-text">Level 2</h2></div>
</div>

<div id="cs-card" class="cs-card-wrap gk-hidden" role="dialog" aria-modal="true" aria-labelledby="cs-card-title">
  <div class="cs-card">
    <h2 id="cs-card-title">Round over</h2>
    <p id="cs-card-solved">Words solved 0</p>
    <p id="cs-card-longest">Longest word 0 letters</p>
    <p id="cs-card-best">Best ever 0</p>
    <button id="cs-again" class="cs-turn cs-again" type="button">Play again</button>
  </div>
</div>

<script src="src/enable-words.js"></script>
<script src="src/cipher.js"></script>
<script src="src/targets.js"></script>
<script type="module" src="src/game.js"></script>
<script type="module" src="src/audio.js"></script>
<script type="module" src="src/menu-glue.js"></script>
</body>
</html>
