<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ServiMobileGames</title>
<meta name="description" content="Free games for phone and desktop from ServiMobileGames. Play in your browser or get them on Google Play.">
<meta property="og:title" content="ServiMobileGames">
<meta property="og:description" content="Free games for phone and desktop.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ugots.github.io/servimobilegames/share.png">
<meta property="og:url" content="https://ugots.github.io/servimobilegames/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ugots.github.io/servimobilegames/share.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--bg2:#121935;--card:#141b34;--fg:#eef1fb;--mute:#aab3cf;--acc:#ffc83d;--accfg:#1a1400;--line:#263057;--disp:"Chakra Petch",Impact,system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden}
a:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--acc)}
.hero{text-align:center;padding:96px 24px 80px;background:radial-gradient(ellipse at 50% 0,#27356f 0,var(--bg2) 45%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero h1{font:700 clamp(2.2rem,8vw,4.6rem)/1.05 var(--disp);margin:0 0 16px;letter-spacing:.02em;text-transform:uppercase}
.hero h1 span{color:var(--acc)}
.hero p{margin:0 auto 32px;max-width:34em;font-size:1.2rem;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:12px;background:var(--acc);color:var(--accfg);font:700 1rem var(--disp);letter-spacing:.03em;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
main{max-width:1240px;margin:0 auto;padding:56px 24px}
h2.sec{font:700 1.7rem var(--disp);text-transform:uppercase;letter-spacing:.04em;margin:0 0 24px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-6px);border-color:var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.art{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;background:var(--bg2)}
.body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font:700 1.35rem var(--disp)}
.body p{margin:0;color:var(--mute);flex:1}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.soon{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px dashed #5a6690;border-radius:12px;color:var(--mute);font-size:.9rem;text-align:center;padding:0 12px}
.gp{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #5a6690;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600}
.nojs{color:var(--mute)}.nojs a{color:var(--acc)}
footer{text-align:center;padding:40px 24px;border-top:1px solid var(--line);color:var(--mute)}
footer a{color:var(--acc)}footer p{margin:4px 0}
@media(min-width:900px){#grid{grid-template-columns:repeat(3,1fr)}.acts{flex-direction:row}.acts .btn{padding:0 18px}.soon,.gp{flex:1}.hero{padding:140px 24px 120px}}
@media(max-width:599px){
.hero{padding:56px 16px 48px}.hero p{font-size:1.05rem}
.hero .btn{width:100%}
main{padding:32px 16px}
#grid{grid-template-columns:1fr;gap:20px}
.card:hover{transform:none}
.acts .btn,.soon,.gp{width:100%;min-height:48px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<section class="hero"><h1>Servi<span>Mobile</span>Games</h1><p>Quick arcade games for phone and desktop. Free to play.</p><a class="btn" href="#games">Browse the games</a></section>
<main id="games"><h2 class="sec">Play now</h2>
<div id="grid"><p class="nojs">Loading games... With JavaScript off, play directly: <a href="anagram-game/">Anagram Ladder</a>, <a href="castle-defense/">Castle Defense</a>, <a href="coin-runner/">Coin Runner</a>, <a href="number-game/">Number Fun</a>, <a href="shooter/">Asteroid Breaker</a>, <a href="word-game/">Letter Pot</a>, <a href="cipher-shift/">Cipher Shift</a>.</p></div></main>
<footer><p>Made by ServiMobileGames</p><p><a href="https://jservi.itch.io">jservi.itch.io</a></p></footer>
<script>
(function () {
  // Google Play ids are placeholders until real ones land. A game counts as "coming soon"
  // while its play URL contains "placeholder" or its package starts with PLACEHOLDER_PREFIX.
  // Set a real package/URL in games.json (and change the prefix) and the badge flips to a live link.
  var PLACEHOLDER_PREFIX = "com.servimobilegames.";
  function isPlaceholder(g) {
    return /placeholder/i.test(g.play || "") || String(g.package || "").indexOf(PLACEHOLDER_PREFIX) === 0;
  }
  var MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return MAP[c]; }); }
  fetch("games.json").then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); }).then(function (d) {
    document.getElementById("grid").innerHTML = d.games.map(function (g) {
      var play = isPlaceholder(g) ? '<span class="soon">Coming soon on Google Play</span>'
        : '<a class="gp" href="' + esc(g.play) + '">Get it on Google Play</a>';
      return '<article class="card"><a href="./' + esc(g.slug) + '/" tabindex="-1" aria-hidden="true"><img class="art" src="share/' + esc(g.slug) +
        '.png" alt="" width="1200" height="630" loading="lazy"></a><div class="body"><h3>' + esc(g.title) + '</h3><p>' + esc(g.tagline) +
        '</p><div class="acts"><a class="btn" href="./' + esc(g.slug) + '/">Play in browser</a>' + play + '</div></div></article>';
    }).join("");
  }).catch(function () {});
})();
</script></body></html>
