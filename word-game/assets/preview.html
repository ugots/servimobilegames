<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Pot - Art Preview</title>
<link rel="stylesheet" href="art.css">
<style>
  html, body { margin: 0; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .lp-table { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 80vw; padding: 40px; box-sizing: border-box; }
  .lp-tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .lp-tile { width: 64px; height: 64px; font-size: 30px; border: none; }
  .lp-chips { display: flex; gap: 10px; }
  .lp-chip { border: none; font-size: 16px; }
</style>
</head>
<body class="lp-bg">
  <div class="lp-table">
    <div class="lp-tiles">
      <button class="lp-tile" type="button">L</button>
      <button class="lp-tile" type="button">E</button>
      <button class="lp-tile" type="button">T</button>
      <button class="lp-tile" type="button">T</button>
      <button class="lp-tile" type="button">E</button>
      <button class="lp-tile" type="button">R</button>
      <button class="lp-tile" type="button">P</button>
      <button class="lp-tile" type="button">O</button>
      <button class="lp-tile" type="button">T</button>
    </div>
    <div class="lp-chips">
      <span class="lp-chip">POT</span>
      <span class="lp-chip">LETTER</span>
      <span class="lp-chip">TREE</span>
    </div>
  </div>
</body>
</html>
